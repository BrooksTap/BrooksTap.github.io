<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar TikTok - AutoVideos</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #222; background: #fff; }
  a { color: #0b57d0; }
  code#c { display:block; word-break:break-all; background:#f2f2f2; padding:12px; border-radius:8px; font-size:15px; }
  button { font-size:16px; padding:10px 18px; margin-top:12px; border-radius:8px; border:0; background:#111; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<h1>Conectar TikTok</h1>
<p id="msg">Copie o código abaixo e cole na janela preta do AutoVideos.</p>
<code id="c"></code>
<button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Copiado!'">Copiar código</button>
<script>
var q=new URLSearchParams(location.search), c=q.get('code');
if(c){document.getElementById('c').textContent=location.href;}
else{document.getElementById('msg').textContent='Não veio código: '+(q.get('error_description')||q.get('error')||'abra pelo AutoVideos.');
document.getElementById('c').style.display='none';document.querySelector('button').style.display='none';}
</script>
</body>
</html>
